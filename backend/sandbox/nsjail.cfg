# Nsjail Configuration Profile for Atom Sandbox (Go Execution)
# High performance, sub-50ms startup, isolated namespaces, seccomp & cgroups

name: "atom-go-sandbox"
description: "Isolated sandbox profile for Go code evaluation"

mode: ONCE
hostname: "atom-sandbox"

# Time & CPU Limits
time_limit: 10
rlimit_cpu: 10
rlimit_as: 512
rlimit_nofile: 64
rlimit_nproc: 64

# Process & Network Isolation
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true

# Mount points (Read-only host system binaries, read-write isolated tmpfs for workspace)
mount {
	src: "/usr"
	dst: "/usr"
	is_bind: true
	mandatory: false
}

mount {
	src: "/lib"
	dst: "/lib"
	is_bind: true
	mandatory: false
}

mount {
	src: "/lib64"
	dst: "/lib64"
	is_bind: true
	mandatory: false
}

mount {
	src: "/bin"
	dst: "/bin"
	is_bind: true
	mandatory: false
}

mount {
	src: "/dev/null"
	dst: "/dev/null"
	is_bind: true
}

mount {
	src: "/dev/urandom"
	dst: "/dev/urandom"
	is_bind: true
}

# Mount tmpfs RAM disk for /tmp workspace
mount {
	dst: "/tmp"
	fstype: "tmpfs"
	options: "size=64m,mode=0777"
}

# Environment
exec_bin {
	path: "/usr/local/go/bin/go"
}
